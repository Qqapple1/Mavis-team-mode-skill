# TeamForge 角色索引（用于自动匹配）
# Leader 在 Phase 1 提取任务关键词，通过此索引模糊匹配最佳角色

worker-coder:
  keywords: [代码, 实现, 开发, 函数, 模块, api, cli]
  desc: 通用代码实现

worker-backend-architect:
  keywords: [后端, api, fastapi, django, flask, 数据库, 服务端, restful, graphql]
  desc: 后端架构设计

worker-frontend-developer:
  keywords: [前端, react, vue, ui, 界面, 组件, css, html, 浏览器]
  desc: 前端开发

worker-tester:
